<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Tanuu.... 🌟</title>
<style>
:root{--pink:#ffc1da;--baby:#ffe3ee;--lav:#cdb6ff;--white:#fff;--night:#150f3d;--night2:#2d1b62;--glow:0 0 18px rgba(255,193,218,.75);
--hand:'Segoe Print','Bradley Hand','Snell Roundhand','Apple Chancery','Comic Sans MS',cursive}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--white);font-family:var(--hand)}
body{background:linear-gradient(170deg,var(--night) 0%,var(--night2) 55%,#6a3a9a 100%)}
#sky,#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx{z-index:50}
.tw{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
.fl{position:absolute;bottom:-40px;animation:rise linear forwards;opacity:0;filter:drop-shadow(0 0 6px var(--pink))}
@keyframes rise{10%{opacity:.9}100%{transform:translate(var(--sx,0),-112dvh) rotate(40deg);opacity:0}}
.fall{position:absolute;top:-30px;animation:fall linear forwards;color:#fff3b0;filter:drop-shadow(0 0 6px #fff3b0)}
@keyframes fall{to{transform:translate(-30vw,112dvh) rotate(200deg);opacity:.2}}
.shoot{position:fixed;z-index:60;height:3px;width:160px;border-radius:3px;pointer-events:none;
background:linear-gradient(90deg,transparent,var(--pink),#fff);box-shadow:0 0 14px 3px rgba(255,193,218,.8);
transform:rotate(25deg);animation:shoot 1.3s ease-in forwards}
.shoot::after{content:"✦";position:absolute;right:-10px;top:-9px;font-size:18px;color:#fff}
@keyframes shoot{from{translate:0 0;opacity:1}to{translate:110vw 55vw;opacity:0}}
.sp{position:fixed;pointer-events:none;z-index:55;animation:sp 1.4s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(120deg);opacity:0}}

.scene{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));text-align:center;overflow:hidden;
opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
.scene.on{opacity:1;visibility:visible}
#s4{background:linear-gradient(160deg,#ffd9e8,#f6c6ee 60%,#d9c4ff)}
#s4 h2,#s4 p{color:#6b2d5c}
#s5{background:linear-gradient(170deg,#2a1560,#7a3b9e 60%,#e58db8)}
h2{font-size:clamp(1.3rem,5.5vw,2rem);font-weight:400;text-shadow:var(--glow);max-width:520px;line-height:1.4}
.line{min-height:2.6em;font-size:clamp(1.25rem,5.5vw,1.9rem);text-shadow:var(--glow);max-width:520px;line-height:1.4}
.btn{font:inherit;font-size:1.1rem;color:#6b2d5c;border:0;cursor:pointer;padding:14px 28px;border-radius:999px;
background:linear-gradient(135deg,#fff,var(--pink));box-shadow:0 0 22px rgba(255,160,205,.8);animation:pulse 2.4s ease-in-out infinite;
transition:transform .2s;opacity:0;pointer-events:none;touch-action:manipulation}
.btn.show{opacity:1;pointer-events:auto;transition:opacity 1s,transform .2s}
.btn:hover{transform:scale(1.07)}.btn:active{transform:scale(.94)}
.btn:focus-visible,.mini:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
.heart{border-radius:60px 60px 60px 60px;padding:16px 34px}
@keyframes pulse{50%{box-shadow:0 0 34px rgba(255,160,205,1)}}
.choices{display:flex;flex-direction:column;gap:12px;width:min(320px,90%)}
.choices .btn{opacity:1;pointer-events:auto;animation:none;background:rgba(255,255,255,.18);color:#fff;
border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.star{width:150px;height:150px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 0 16px #ffe9a8)}
.star.sm{width:84px;height:84px}
@keyframes bob{50%{transform:translateY(-14px) rotate(3deg)}}
.star g.arm{transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box}
.star .aL{transform-origin:100% 0}.star .aR{transform-origin:0 0}
.star.open .aL{transform:rotate(70deg)}.star.open .aR{transform:rotate(-70deg)}
.star.open{animation:hug .9s ease-in-out infinite}
@keyframes hug{50%{transform:scale(1.18)}}
.star .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

.card{width:min(440px,100%);max-height:calc(100dvh - 130px);overflow-y:auto;padding:26px 22px;border-radius:22px;text-align:left;color:#7a2f5d;
background:linear-gradient(160deg,#fff4f8,#ffe0ec);box-shadow:0 0 40px rgba(255,160,205,.6),inset 0 0 0 2px rgba(255,255,255,.7);
transition:opacity 1s,filter 1s,transform 1s}
.card p{margin-bottom:14px;line-height:1.65;font-size:1.02rem;opacity:0;transform:translateY(8px);animation:ink 1.4s forwards}
.card p.sig{text-align:right}
@keyframes ink{to{opacity:1;transform:none}}
.card.gone{opacity:0;filter:blur(8px);transform:scale(.9)}

.player{width:min(560px,100%);aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:rgba(255,255,255,.45);
border:3px solid #fff;box-shadow:0 10px 40px rgba(190,90,160,.45);display:flex;align-items:center;justify-content:center}
.player video{width:100%;height:100%;background:#000;object-fit:contain}
.ph{color:#8a3a70;font-size:1.2rem;padding:16px}.ph b{display:block;font-size:2.4rem;animation:bob 2.2s infinite}

.moon{position:absolute;top:5dvh;right:8vw;width:78px;height:78px;border-radius:50%;box-shadow:inset -22px 6px 0 0 #fff3c4;
filter:drop-shadow(0 0 22px #fff3c4);transform:rotate(-20deg);animation:tw 6s infinite}
#s5 .star.corner{position:absolute;left:12px;bottom:max(14px,env(safe-area-inset-bottom))}
#m5{min-height:7.5em;display:flex;align-items:center;justify-content:center;font-size:clamp(1.3rem,6vw,2rem);text-shadow:0 0 14px rgba(255,255,255,.8);max-width:520px;line-height:1.4;transition:opacity .6s}
#m5.final{font-size:clamp(1.6rem,7vw,2.4rem)}
#done{min-height:1.6em;font-size:1.25rem;text-shadow:var(--glow)}
.mini{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:70;width:44px;height:44px;border-radius:50%;font-size:1.3rem;
border:1px solid rgba(255,255,255,.6);color:#fff;cursor:pointer;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none}
.mini.on{display:block}.mini.off{opacity:.5}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
.card p{opacity:1;transform:none}.tw{opacity:.8}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><radialGradient id="sg" cx="50%" cy="40%"><stop offset="0" stop-color="#fff7c2"/><stop offset="1" stop-color="#ffd86b"/></radialGradient></defs></svg>
<div id="sky"></div>
<div id="fx"></div>
<button class="mini" id="music" aria-label="Music on or off" title="Music">♪</button>

<!-- SCENE 1 -->
<section class="scene on" id="s1">
  <div class="star-slot" data-star></div>
  <div class="line" id="t1a"></div>
  <div class="line" id="t1b"></div>
  <button class="btn heart" id="go1">Come here, Tanuu... ♡</button>
</section>

<!-- SCENE 2 -->
<section class="scene" id="s2">
  <div class="card" id="card"></div>
  <button class="btn" id="go2">Wanna see a shooting star? 🌠</button>
</section>

<!-- SCENE 3 -->
<section class="scene" id="s3">
  <div class="star-slot" data-star></div>
  <h2>Tanu..… kya hua, naraz ho? 🥺</h2>
  <div class="choices" id="choices">
    <button class="btn" data-r="0">Haan, thodi si 😤</button>
    <button class="btn" data-r="1">Thoda sa sad hoon 🥹</button>
    <button class="btn" data-r="2">Gussssaaa huuu.. 🫂</button>
  </div>
  <div class="line" id="resp"></div>
  <button class="btn" id="go3">One tiny surprise for you →</button>
</section>

<!-- SCENE 4 -->
<section class="scene" id="s4">
  <h2>A little something to make you smile, Tanuuu... 💗</h2>
  <div class="player" id="player"></div>
  <p class="line" style="min-height:0">Ready for the last little surprise? ✨</p>
  <button class="btn show" id="go4">Next, my little star →</button>
</section>

<!-- SCENE 5 -->
<section class="scene" id="s5">
  <div class="moon"></div>
  <div id="m5"></div>
  <button class="btn" id="hug">Tap 5 to 10 timess if uuu... smiled 🫂</button>
  <div id="done"></div>
  <div class="star sm corner" id="cornerStar" data-star-inline></div>
</section>

<script>
/* ============ 🎵 ADD YOUR MEDIA HERE ============
   1) SONG_SRC  → put your audio file path between the quotes, e.g. "music/song.mp3"
   2) VIDEO_SRC → put your video file path between the quotes, e.g. "video/surprise.mp4"
   Leave them empty and the site still works (no music, video shows a placeholder). */
const SONG_SRC = "TanuSong.mp3";
const VIDEO_SRC = "VikramAkshitSorryyy.mp4";

/* ============ ✏️ EDIT YOUR WORDS HERE ============ */
const LETTER = [
"Hey, Tanuu… 🌷🩷✨",

"Pata hai, kabhi-kabhi na, bina kisi special reason ke bhi dil udaas ho jaata hai. 🥺💗 Aur kabhi sab kuch theek hote hue bhi kuch theek nahi lagta. 🌧️🫂",

"I don’t know exactly what you’re feeling right now, and I won’t pretend that I can magically fix everything. 🥹💕 But I want you to know one thing  tumhe esse akelaa too bilkulll nahi chodhnee walaa 🫂💗🌷.",

"Agar aaj smile karne ka mann nahi hai, toh mat karo. 🥺 Agar baat karne ka mann nahi hai, toh woh bhi okay hai. 🩷🫶 You don’t have to explain every little thing or pretend to be happy just to make everyone else comfortable. 🌸🤍",

"Bas thoda sa rest kar lo, apne aap ko time do, aur yaad rakhna ki tumhareee nraaz hone se ek insaaan ko kaafi jyadaa farq padta hai...😭💗🫂",

"And Tanuu...? 🌷 Even the stars disappear from the sky sometimes, but that doesn’t mean they stop shining. ✨🌙⭐",

"So, tum merii one of my favvv star yani sirius se bhi pheleee aati ho 🥰🌟💖, take a deep breath. 🌬️🫶 You don’t need to figure everything out today. One little step at a time, okay? 🐣🌷",

"Sending you the biggest virtual hug, the softest forehead kiss, and anddd ekkkk jaduuuuuuu ki jhappppppppppppiiiiii heheheehhehe . 🫂💗✨🌟",

"Abhi ke liye bas itna yaad rakhna: you matter, your feelings matter, and you deserve myyyy careeee... too. 🥹💞 Tum jab tak Nahi khushhh hogii tumhe mnata rahungaaa 💕🫂🌷🥰",

"— Someone who really wants to see you smile again. 🌙💗✨"
];
const S1_LINES = ["I understand… 🥺💗", "Just click here, Seniorrrrr ✨"];
const S3_REPLIES = [
  "Achha baba, sorryyy… ab gussa thoda kam karein? 🥺💗",
  "Awww, idhar aao… sending you the biggest hug. 🫂",
  "Hug delivery for my Tanuuuu....! 💗🫂"
];
const S5_LINES = [
  "Tanuuu… aise udaas aaappp bilkulll achiii nahiii lagtiii ? 🥺💗",
  "Khushhhhh raha karo naaa… 🌷",
  "Aapke khush rehne se iss Earth par koi aur bhi bohot zyaada khush hota hai. 🌍💞",
  "Chalo abbb… ek chhoti si smile toh doooooooooooo! 🥹🫶"
];
const S5_FINAL = "Hasooo abbb, ekkkkkkk badiiiiiiiiiiiii si smileeeeee! ✨💗";
const HUG_DONE = "💗 🥹 🌷 ✨ 🫂 💕 🩷 🥰 🌙 💖 🦋 🤍 🫶 💓 🎀 🌸 🥺 💞 ⭐ 🧸 💝 🩵 🌹 🥲 💘 ☁️ 🫰 💜 🌟 💐 😍 🪷 ❤️ 💫 🕊️ 💟 🧡 🫠 🌺 💛 🥹💕 🪻 🩶 💚 🖤 🌻 💌 🤎 🩷✨ 🪽 🌈 💖🫂 🌼 🫀 ❤️‍🔥 💮 🩵🥹 🌠 🧁 🍓 🦢 💗🌷 💞✨ 🪐 🫶🏻 💝🌸 🥰💗 🫂💖 🎀🩷 🥺💞 🌙💗 🤍✨ 💐💕 🧸💖 💓🌷 🦋💗 🥹🫶 💕🌸 🩷🫂 💖✨ 🌹💗 🥺🩷 🫶💞 🌟💖 💗🤍 🥰💕 🌷💖 🫂🩷 💓✨ 💝🥹 🌸💞 🩵🫶 💗⭐ 💖🎀 🥹🌙 💕🦋 🩷 Tanuuuuuuuu.....!🌹 🫂✨ 💞🤍 💗💗 💖💖 🥹🥹 🫶🫶 🌷🌷 💕💕 ✨✨ 🩷🩷 🧸🎀💗 🌸🦋💖 🌙⭐💕 🥹🫂💞 🩷🌷✨ 💖🤍🫶 💗🎀🧸 💕🌹✨ 🥺🩷🫂 💞🌸🦋 💖🌙⭐ 🥰🫶💗 🤍🌷💞 🩵✨💕 ❤️‍🩹💗 🫂🥹🌸 💘🦋💖 🎀🌷🩷 🌹💐🤍 🥹💖✨ 💕🫶🌙 🧸🩷💞 💗🪽✨ 💌";
const PLACEHOLDER = "Your little surprise will be here ♡";

/* ============ ENGINE (no need to edit below) ============ */
const $ = s => document.querySelector(s);
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const fx = $("#fx"), sky = $("#sky");

/* star character */
const STAR = `<svg viewBox="0 0 120 120" class="star-svg" aria-hidden="true">
<g class="arm aL"><path d="M24 70 Q12 80 10 94" stroke="#ffd86b" stroke-width="9" stroke-linecap="round" fill="none"/></g>
<g class="arm aR"><path d="M96 70 Q108 80 110 94" stroke="#ffd86b" stroke-width="9" stroke-linecap="round" fill="none"/></g>
<polygon points="60,14 74.7,43.8 107.5,48.5 83.8,71.7 89.4,104.5 60,89 30.6,104.5 36.2,71.7 12.5,48.5 45.3,43.8" fill="url(#sg)" stroke="#ffd86b" stroke-width="9" stroke-linejoin="round"/>
<g class="eye"><ellipse cx="50" cy="62" rx="5" ry="7" fill="#4a2a5e"/><circle cx="52" cy="59" r="2.2" fill="#fff"/></g>
<g class="eye"><ellipse cx="70" cy="62" rx="5" ry="7" fill="#4a2a5e"/><circle cx="72" cy="59" r="2.2" fill="#fff"/></g>
<ellipse cx="41" cy="73" rx="6" ry="3.6" fill="#ff9ec4" opacity=".8"/><ellipse cx="79" cy="73" rx="6" ry="3.6" fill="#ff9ec4" opacity=".8"/>
<path d="M54 73 Q60 80 66 73" stroke="#4a2a5e" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>`;
document.querySelectorAll("[data-star]").forEach(e => e.innerHTML = `<div class="star">${STAR}</div>`);
$("#cornerStar").innerHTML = STAR;

/* twinkling sky */
for (let i = 0; i < 55; i++) {
  const d = document.createElement("i"); d.className = "tw";
  d.style.cssText = `left:${rnd(0,100)}%;top:${rnd(0,100)}%;animation-delay:${rnd(0,3)}s;animation-duration:${rnd(2,5)}s`;
  sky.appendChild(d);
}
/* floating things */
function floatUp(chars, host = fx) {
  const d = document.createElement("span"); d.className = "fl";
  d.textContent = chars[Math.floor(Math.random() * chars.length)];
  d.style.cssText = `left:${rnd(0,95)}%;font-size:${rnd(14,28)}px;--sx:${rnd(-40,40)}px;animation-duration:${rnd(8,14)}s`;
  host.appendChild(d); setTimeout(() => d.remove(), 15000);
}
function fallStar(host) {
  const d = document.createElement("span"); d.className = "fall";
  d.textContent = Math.random() < .5 ? "✦" : "♥";
  d.style.cssText = `left:${rnd(10,120)}%;font-size:${rnd(10,22)}px;animation-duration:${rnd(5,9)}s;${d.textContent==="♥"?"color:#ffb3d1":""}`;
  host.appendChild(d); setTimeout(() => d.remove(), 9500);
}
if (!RM) {
  setInterval(() => floatUp(["♥","♡","💗","✨"]), 1400);
  setInterval(() => { if (cur === 5) { fallStar($("#s5")); fallStar($("#s5")); } }, 700);
  setInterval(() => { if (cur === 5) shoot(); }, 5000);
}
function shoot() {
  const s = document.createElement("div"); s.className = "shoot";
  s.style.cssText = `left:${rnd(-5,40)}%;top:${rnd(2,35)}%`;
  document.body.appendChild(s); setTimeout(() => s.remove(), 1400);
}
function burst(x, y, n = 28, chars = ["✨","💗","⭐","♥","✦"]) {
  for (let i = 0; i < n; i++) {
    const d = document.createElement("span"); d.className = "sp";
    d.textContent = chars[i % chars.length];
    d.style.cssText = `left:${x}px;top:${y}px;font-size:${rnd(12,26)}px;--dx:${rnd(-160,160)}px;--dy:${rnd(-200,120)}px`;
    document.body.appendChild(d); setTimeout(() => d.remove(), 1500);
  }
}
async function type(el, text, sp = 50) {
  el.textContent = "";
  if (RM) { el.textContent = text; return; }
  for (const ch of Array.from(text)) { el.textContent += ch; await wait(sp); }
}
const reveal = b => b.classList.add("show");

/* music */
const musicBtn = $("#music");
let audio = null, userPaused = false, blocked = false;
if (SONG_SRC) {
  audio = new Audio(SONG_SRC); audio.loop = true; audio.volume = .3;
  audio.addEventListener("error", () => { musicBtn.classList.remove("on"); audio = null; });
  musicBtn.classList.add("on");
  audio.play().catch(() => { blocked = true; });          // autoplay attempt
}
function startMusic() {
  if (audio && !userPaused && audio.paused) audio.play().then(() => blocked = false).catch(() => {});
}
addEventListener("pointerdown", () => { if (blocked) startMusic(); }, { once: false });
musicBtn.onclick = () => {
  if (!audio) return;
  if (audio.paused) { userPaused = false; audio.play().catch(()=>{}); musicBtn.classList.remove("off"); musicBtn.textContent = "♪"; }
  else { userPaused = true; audio.pause(); musicBtn.classList.add("off"); musicBtn.textContent = "♪̸"; }
};

/* scenes */
let cur = 1; const entered = {};
function go(n) {
  $("#s" + cur).classList.remove("on");
  setTimeout(() => {
    cur = n; $("#s" + n).classList.add("on");
    if (n !== 4) stopVideo();
    if (!entered[n] && enter[n]) { entered[n] = 1; enter[n](); }
  }, RM ? 0 : 700);
}
const enter = {
  1: async () => {
    await wait(700);
    await type($("#t1a"), S1_LINES[0]); await wait(500);
    await type($("#t1b"), S1_LINES[1]); await wait(300);
    reveal($("#go1"));
  },
  2: async () => {
    const card = $("#card"), btn = $("#go2");
    for (let i = 0; i < LETTER.length; i++) {
      const p = document.createElement("p");
      if (i === LETTER.length - 1) p.className = "sig";
      p.textContent = LETTER[i];
      p.style.animationDelay = "0s";
      card.appendChild(p);
      card.scrollTo({ top: card.scrollHeight, behavior: RM ? "auto" : "smooth" });
      await wait(Math.min(900 + LETTER[i].length * 28, 4200));
    }
    reveal(btn);
  },
  3: () => {},
  4: () => buildPlayer(),
  5: async () => {
    const m = $("#m5");
    for (const t of S5_LINES) { m.classList.remove("final"); await type(m, t, 55); await wait(1700); m.style.opacity = 0; await wait(600); m.style.opacity = 1; }
    m.classList.add("final"); await type(m, S5_FINAL, 60); await wait(400);
    reveal($("#hug"));
  }
};
enter[1]();

/* scene 1 → 2 */
$("#go1").onclick = e => {
  startMusic(); burst(e.clientX, e.clientY, 14); shoot();
  setTimeout(() => go(2), RM ? 0 : 1000);
};
/* scene 2 → 3 */
$("#go2").onclick = e => {
  const r = $("#card").getBoundingClientRect();
  for (let i = 0; i < 4; i++) burst(r.left + rnd(0, r.width), r.top + rnd(0, r.height), 10, ["✨","✦","💗"]);
  $("#card").classList.add("gone"); $("#go2").classList.remove("show"); shoot();
  setTimeout(() => go(3), RM ? 0 : 1800);
};
/* scene 3 */
document.querySelectorAll("#choices .btn").forEach(b => b.onclick = async e => {
  const i = +b.dataset.r, st = $("#s3 .star");
  st.classList.toggle("open", i === 2);
  if (i === 1) burst(e.clientX, e.clientY, 10, ["💗","🫂"]);
  if (i === 2) burst(innerWidth / 2, innerHeight * .3, 24);
  await type($("#resp"), S3_REPLIES[i], 35);
  reveal($("#go3"));
});
$("#go3").onclick = () => go(4);

/* scene 4: video (nothing loads unless VIDEO_SRC is filled in) */
let video = null;
function buildPlayer() {
  const box = $("#player");
  const ph = () => { box.innerHTML = `<div class="ph"><b>💗</b>${PLACEHOLDER}</div>`; video = null; };
  if (!VIDEO_SRC) return ph();
  video = document.createElement("video");
  video.controls = true; video.playsInline = true; video.preload = "metadata";
  video.setAttribute("playsinline", "");
  video.addEventListener("error", ph);
  video.addEventListener("play", () => { if (audio) audio.pause(); });
  const resume = () => startMusic();
  video.addEventListener("pause", resume); video.addEventListener("ended", resume);
  video.src = VIDEO_SRC; box.appendChild(video);
}
function stopVideo() { if (video && !video.paused) video.pause(); }
$("#go4").onclick = () => { stopVideo(); startMusic(); go(5); };

$("#hug").onclick = async e => {
  const r = e.currentTarget.getBoundingClientRect();
  const cs = $("#cornerStar"); cs.classList.add("open");
  for (let i = 0; i < 5; i++) burst(rnd(30, innerWidth - 30), rnd(innerHeight * .3, innerHeight * .8), 10);
  burst(r.left + r.width / 2, r.top, 20);
  for (let i = 0; i < 14; i++) setTimeout(() => floatUp(["💗","♥","✨","⭐","💖"]), i * 90);
  await type($("#done"), HUG_DONE, 35);
  setTimeout(() => cs.classList.remove("open"), 3000);
};
